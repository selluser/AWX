---
- name: Test AWX
  hosts: all
  become: true
  tasks:
    - name: Ping
      ansible.builtin.ping:

    - name: Installer htop
      ansible.builtin.apt:
        name: htop
        state: present
        update_cache: true

    - name: Créer un fichier témoin
      ansible.builtin.copy:
        dest: /tmp/awx-tp.txt
        content: "Déployé par AWX\n"
